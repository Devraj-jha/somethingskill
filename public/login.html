<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in – SkillPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><script>try{var t=localStorage.getItem("sp-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/landing.css"><style>.box{max-width:460px;margin:40px auto}.demo{background:var(--soft);border-radius:10px;padding:12px;font-size:.85rem;margin-bottom:16px}.demo button{margin-right:6px}</style></head><body>
<div class="box wrap"><div class="flex" style="justify-content:space-between;margin-bottom:18px"><a class="brand" href="index.html"><span id="lg"></span>SkillPath</a><button class="btn ghost sm theme" data-theme-btn type="button"></button></div>
<div class="card"><h2 id="t">Sign in</h2><div class="demo"><b>Demo accounts (fictional data)</b><br>Student: student@skillpath.demo / Student@123<br>Admin: admin@skillpath.demo / Admin@123<br><button class="btn sm ghost" data-d="s" type="button">Use student</button><button class="btn sm ghost" data-d="a" type="button">Use admin</button></div>
<form id="f" novalidate><div id="reg" hidden><div class="field"><label for="name">Full name</label><input id="name" autocomplete="name"></div></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<div id="reg2" hidden><div class="field"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password"></div>
<div class="field"><label for="college">College / Institution</label><input id="college"></div><div class="row"><div class="field"><label for="programme">Programme</label><input id="programme" value="B.Tech CSE"></div><div class="field"><label for="semester">Semester</label><select id="semester"></select></div></div></div>
<p id="err" role="alert" style="color:var(--red);min-height:1.4em"></p><button class="btn" style="width:100%;justify-content:center" id="go">Sign in</button></form>
<p style="margin:14px 0 0;font-size:.88rem"><a href="#" id="sw">New here? Create an account</a> · <a href="#" id="fp">Forgot password?</a></p></div></div>
<script src="js/common.js"></script><script>
document.getElementById('lg').innerHTML=LOGO;document.querySelector('#lg svg').style.width='30px';
semester.innerHTML=[1,2,3,4,5,6,7,8].map(n=>`<option ${n==5?'selected':''}>${n}</option>`).join('');
let reg=false;const set=r=>{reg=r;t.textContent=r?'Create your account':'Sign in';go.textContent=r?'Create account':'Sign in';document.getElementById('reg').hidden=document.getElementById('reg2').hidden=!r;sw.textContent=r?'Already registered? Sign in':'New here? Create an account';err.textContent=''};
set(location.hash==='#register');sw.onclick=e=>{e.preventDefault();set(!reg)};
fp.onclick=e=>{e.preventDefault();err.style.color='var(--mute)';err.textContent='Password reset by email is not part of this demo. Ask your administrator to create a new account.'};
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{set(false);email.value=b.dataset.d=='s'?'student@skillpath.demo':'admin@skillpath.demo';password.value=b.dataset.d=='s'?'Student@123':'Admin@123'});
f.onsubmit=async e=>{e.preventDefault();err.style.color='var(--red)';err.textContent='';go.disabled=true;
 try{const u=await api(reg?'register':'login','POST',{name:name.value,email:email.value,password:password.value,confirm:confirm.value,college:college.value,programme:programme.value,semester:semester.value});location.href=u.role==='admin'?'app.html#admin':'app.html#overview'}
 catch(x){err.textContent=x.message}go.disabled=false};
</script></body></html>
